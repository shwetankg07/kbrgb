# kbrgb presets — edit freely, the picker (SUPER+SHIFT+K) reads this live.
# Format:  Name = kbrgb arguments
# Args: hex colors, effect names, "theme", "off", "-b N" brightness, "-s N" speed.
# Run `kbrgb --help` for everything available.

# ── sync & static ─────────────────────────────
Theme Sync = theme
Cpunk Red = ff2a2a
Rainbow Zones = ff0000 00ff41 0066ff ff00ff
Cyberpunk = 00eaff ff0090 00eaff ff0090
Matrix Green (static) = 00ff41
Amber Retro = ffb000
Ice White = ffffff
Sunset Fade = ff3300 ff6600 ff9900 ffcc00
Ocean Fade = 0033ff 0066dd 0099bb 00ccaa
Night Dim = -b 15 aaaaaa

# ── calm & sexy ───────────────────────────────
Aurora Borealis = aurora
Ocean Swells = ocean
Lava Flow = lava
Candlelight = candle
Ripple (theme) = ripple
Breathing (theme) = breathe
Heartbeat = heartbeat ff0044
Slow Wave = -s 12 wave

# ── motion ────────────────────────────────────
Snake (theme) = snake
KITT Scanner = snake ff0000
Cyan Meteor = meteor 00eaff
Comet Duel = duel
Shadow Gap = shadow 00eaff
Marquee Chase = chase ffb000
Rainbow Wave = wave
Rainbow Cycle = rainbow

# ── drama ─────────────────────────────────────
Thunderstorm = storm
Prism Ripple = prism
Glitch = glitch
Volcano Eruption = eruption
Red Alert = redalert
Supernova = supernova
Shockwave = shockwave
Digital Rain = matrix
Fireplace = fire
Police Lights = police
Disco Beat = disco
Sparkle (theme) = sparkle
Party Strobe = -s 0.4 strobe

# ── functional ────────────────────────────────
CPU Heat Gauge = cpuheat
Battery Bar = battery
System Load = load
Net Meter = netpulse
Day Clock = clock
Pomodoro 25 = pomo 25

# ── reactive (typing) ─────────────────────────
Typewriter = typewriter
Key Flash = keyflash 00eaff
Speed Heat = wpmheat 80
Zen Mode = zen -s 30
Flow State = flow 80

# ── EC native (hardware animates, zero CPU) ───
HW Boot Wave = native wave
HW Zoom Pulse = native zoom
HW Neon Cycle = native neon
HW Breathing = native breathe
HW Meteor = native meteor
HW Twinkle = native twinkle

# ── off ───────────────────────────────────────
Off = off
